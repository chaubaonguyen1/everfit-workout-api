services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: everfit
      POSTGRES_PASSWORD: everfit
      POSTGRES_DB: workouts
    ports:
      # Host port 5434 avoids clashing with a locally installed Postgres on 5432.
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U everfit -d workouts']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://everfit:everfit@db:5432/workouts?schema=public
      LOG_LEVEL: info
      SLOW_QUERY_MS: 200
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3

  # Throwaway database for e2e tests: `docker compose --profile test up -d db-test`
  db-test:
    profiles: ['test']
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: everfit
      POSTGRES_PASSWORD: everfit
      POSTGRES_DB: workouts_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U everfit -d workouts_test']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
